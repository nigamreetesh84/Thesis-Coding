[project]
name = "eligibility-aware-credit-card-rag"
version = "0.1.0"
description = "Eligibility-aware, explainable multi-bank credit card recommendation using RAG."
requires-python = ">=3.11"
readme = "README.md"

[project.optional-dependencies]
dev = ["mypy>=1.11.0", "ruff>=0.6.0"]

[tool.ruff]
line-length = 110
target-version = "py311"
exclude = ["notebooks", "dashboard"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
ignore = ["E501"]

[tool.mypy]
python_version = "3.12"
ignore_missing_imports = true
disallow_untyped_defs = true
warn_unused_ignores = true
warn_return_any = false
explicit_package_bases = true
mypy_path = "."
exclude = ["notebooks/", "dashboard/"]

[[tool.mypy.overrides]]
module = "tests.*"
disallow_untyped_defs = false

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"