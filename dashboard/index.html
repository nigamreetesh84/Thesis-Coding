<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Credit Card Recommender</title>
  <style>
    :root { color-scheme: dark; }
    body {
      background: #0f1117; color: #e6e6e6; font-family: system-ui, sans-serif;
      margin: 0; padding: 2rem; max-width: 960px; margin-inline: auto;
    }
    h1 { font-size: 1.4rem; margin-bottom: 0.25rem; }
    .subtitle { color: #9aa0a6; margin-bottom: 1.5rem; }
    form {
      display: grid; grid-template-columns: repeat(auto-fit, minmax(180px, 1fr));
      gap: 1rem; background: #171923; padding: 1.25rem; border-radius: 10px;
      border: 1px solid #2a2d3a;
    }
    label { display: flex; flex-direction: column; font-size: 0.85rem; gap: 0.35rem; }
    input, select {
      background: #0f1117; color: #e6e6e6; border: 1px solid #2a2d3a;
      border-radius: 6px; padding: 0.5rem;
    }
    button {
      grid-column: 1 / -1; background: #4c6ef5; color: white; border: none;
      border-radius: 8px; padding: 0.75rem; font-size: 1rem; cursor: pointer;
    }
    button:hover { background: #3b5bdb; }
    .stats { display: flex; gap: 1.5rem; margin: 1.25rem 0; flex-wrap: wrap; }
    .stat { background: #171923; border: 1px solid #2a2d3a; border-radius: 8px; padding: 0.75rem 1rem; }
    .stat .value { font-size: 1.3rem; font-weight: 600; }
    .stat .label { font-size: 0.75rem; color: #9aa0a6; }
    .cards { display: grid; grid-template-columns: repeat(auto-fit, minmax(260px, 1fr)); gap: 1rem; }
    .card { border-radius: 10px; padding: 1rem; border: 1px solid #2a2d3a; }
    .card.recommended { background: #0f3d24; border-color: #2b8a3e; }
    .card.not-eligible { background: #3d1a1a; border-color: #c92a2a; }
    .card h3 { margin: 0 0 0.35rem; font-size: 1rem; }
    .card .badge {
      display: inline-block; font-size: 0.7rem; padding: 0.15rem 0.5rem;
      border-radius: 999px; margin-bottom: 0.5rem; font-weight: 600;
    }
    .card.recommended .badge { background: #2b8a3e; }
    .card.not-eligible .badge { background: #c92a2a; }
    .card p { margin: 0.25rem 0; font-size: 0.85rem; color: #d3d6db; }
    .card .chunk { font-size: 0.75rem; color: #9aa0a6; }
    .what-to-change { border-left: 3px solid #ffd43b; padding-left: .5rem; color: #ffe8a3; }
    .closest { margin-top: .8rem; color: #ffe8a3; }
    #error { color: #ff8787; margin-top: 0.75rem; }
    .ask { background: #171923; border: 1px solid #2a2d3a; border-radius: 10px; padding: 1.25rem; margin-bottom: 1.25rem; }
    .ask textarea {
      width: 100%; box-sizing: border-box; min-height: 70px; background: #0f1117; color: #e6e6e6;
      border: 1px solid #2a2d3a; border-radius: 6px; padding: 0.6rem; font: inherit;
    }
    .ask button { margin-top: 0.6rem; width: 100%; }
    .ask .understood { font-size: 0.8rem; color: #9aa0a6; margin-top: 0.6rem; }
    .ask .questions { color: #ffd43b; margin-top: 0.6rem; font-size: 0.9rem; }
    .card.needs-review { background: #3d3410; border-color: #f59f00; }
    .card.needs-review .badge { background: #f59f00; }
    .or { text-align: center; color: #9aa0a6; font-size: 0.8rem; margin: 0.5rem 0 1rem; }
  </style>
</head>
<body>
  <h1>Eligibility-Aware Credit Card Recommender</h1>
  <p class="subtitle">Retrieval-augmented, explainable, multi-bank recommendation dashboard.</p>

  <div class="ask">
    <label for="nl-message">Describe yourself in plain language</label>
    <textarea id="nl-message" placeholder="e.g. I'm 32, salaried, earning 9 lakh a year, CIBIL 760, and I already have an SBI savings account. I want a travel card."></textarea>
    <button type="button" id="nl-send">Ask</button>
    <div class="questions" id="nl-questions"></div>
    <div class="understood" id="nl-understood"></div>
  </div>
  <div class="or">or enter the profile fields directly</div>

  <form id="profile-form">
    <label>Annual income (INR)
      <input type="number" id="annual_income" value="800000" min="0" required />
    </label>
    <label>Age
      <input type="number" id="age" value="27" min="18" max="100" required />
    </label>
    <label>CIBIL score
      <input type="number" id="cibil" value="760" min="300" max="900" required />
    </label>
    <label>Employment
      <select id="employment">
        <option value="salaried">Salaried</option>
        <option value="self-employed">Self-employed</option>
        <option value="business owner">Business owner</option>
      </select>
    </label>
    <label>Existing bank relationship
      <select id="existing_relationship">
        <option value="false">No</option>
        <option value="true">Yes</option>
      </select>
    </label>
    <button type="submit">Get recommendations</button>
  </form>

  <div id="error"></div>

  <div class="stats">
    <div class="stat"><div class="value" id="stat-latency">-</div><div class="label">Latency (l_ms)</div></div>
    <div class="stat"><div class="value" id="stat-k">-</div><div class="label">Retrieved k</div></div>
    <div class="stat"><div class="value" id="stat-count">-</div><div class="label">Decisions</div></div>
    <div class="stat"><div class="value" id="stat-p95">-</div><div class="label">p95 latency (telemetry)</div></div>
  </div>

  <div class="cards" id="cards"></div>

  <script>
    const API_BASE = (window.location.port === "5500" || window.location.protocol === "file:")
      ? "http://localhost:8000"
      : "";

    // -------------------------------------------------------------------------
    // Enable the mock backend only with ?mock=true.
    // -------------------------------------------------------------------------
    const USE_MOCK = new URLSearchParams(window.location.search).get("mock") === "true";

    async function mockFetch(url, options) {
      return new Promise((resolve) => {
        setTimeout(() => {
          if (url.includes('/telemetry')) {
            resolve({ ok: true, json: async () => ({ p95_latency_ms: 42.5 }) });
          } else if (url.includes('/recommend')) {
            const payload = JSON.parse(options.body);
            const isEligible = payload.cibil > 700;
            resolve({
              ok: true,
              json: async () => ({
                latency_ms: 120.5,
                retrieved_k: 5,
                decisions: [
                  {
                    recommended: isEligible,
                    bank: "HDFC",
                    card: "Infinia",
                    reason: isEligible ? "Excellent credit score and high income." : "CIBIL score below threshold.",
                    cited_chunk_id: "hdfc_infinia_001"
                  },
                  {
                    recommended: true,
                    bank: "SBI",
                    card: "SimplyCLICK",
                    reason: "Good fit for online shopping.",
                    cited_chunk_id: "sbi_simply_004"
                  }
                ]
              })
            });
          }
        }, 600); // simulate network delay
      });
    }

    const originalFetch = window.fetch;
    window.fetch = async (url, options) => {
      if (USE_MOCK) return mockFetch(url, options);
      return originalFetch(url, options);
    };
    // -------------------------------------------------------------------------

    async function refreshTelemetry() {
      try {
        const res = await fetch(`${API_BASE}/telemetry`);
        const data = await res.json();
        document.getElementById("stat-p95").textContent = data.p95_latency_ms.toFixed(0) + " ms";
      } catch (e) {
        // telemetry is best-effort; ignore failures here
      }
    }

    document.getElementById("profile-form").addEventListener("submit", async (event) => {
      event.preventDefault();
      document.getElementById("error").textContent = "";

      const payload = {
        annual_income: Number(document.getElementById("annual_income").value),
        age: Number(document.getElementById("age").value),
        cibil: Number(document.getElementById("cibil").value),
        employment: document.getElementById("employment").value,
        existing_relationship: document.getElementById("existing_relationship").value === "true",
        banks: ["SBI", "HDFC"],
      };

      try {
        const res = await fetch(`${API_BASE}/recommend`, {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify(payload),
        });
        if (!res.ok) {
          throw new Error(`Request failed with status ${res.status}`);
        }
        const data = await res.json();
        renderResult(data);
        refreshTelemetry();
      } catch (err) {
        document.getElementById("error").textContent = "Error: " + err.message;
      }
    });

    function renderResult(data) {
      document.getElementById("stat-latency").textContent = data.latency_ms.toFixed(1) + " ms";
      document.getElementById("stat-k").textContent = data.retrieved_k;
      document.getElementById("cards").scrollIntoView({ behavior: "smooth", block: "start" });
      document.getElementById("stat-count").textContent = data.decisions.length;

      const container = document.getElementById("cards");
      container.innerHTML = "";
      for (const decision of data.decisions) {
        const card = document.createElement("div");
        const review = decision.needs_review === true;
        card.className = "card " + (review ? "needs-review" : (decision.recommended ? "recommended" : "not-eligible"));
        card.innerHTML = `
          <span class="badge">${review ? "CHECK WITH BANK" : (decision.recommended ? "RECOMMENDED" : "NOT ELIGIBLE")}</span>
          <h3>${decision.bank} — ${decision.card}</h3>
          <p>${decision.reason}</p>
          ${decision.what_to_change ? `<p class="what-to-change"><b>What needs to change:</b> ${decision.what_to_change.replace(/^To qualify: /, "")}</p>` : ""}
          <p class="chunk">cited chunk: ${decision.cited_chunk_id ?? "n/a"}</p>
        `;
        container.appendChild(card);
      }
    }

    // ---- natural-language interface (POST /ask) ----------------------------
    let nlPrevious = null;  // what was understood so far, while a follow-up is pending
    document.getElementById("nl-send").addEventListener("click", async () => {
      const message = document.getElementById("nl-message").value.trim();
      if (!message) return;
      document.getElementById("error").textContent = "";
      try {
        const res = await fetch(`${API_BASE}/ask`, {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ message, previous: nlPrevious }),
        });
        if (!res.ok) throw new Error(`HTTP ${res.status}`);
        const data = await res.json();
        const u = data.understood;
        const fmt = (v) => (v === null || v === undefined ? "?" : v);
        // Keep the form in step with what was understood, so the two views never disagree.
        const setField = (id, v) => { if (v !== null && v !== undefined) document.getElementById(id).value = String(v); };
        setField("annual_income", u.income !== null && u.income !== undefined ? Math.round(u.income) : null);
        setField("age", u.age);
        setField("cibil", u.cibil);
        setField("employment", u.employment);
        setField("existing_relationship", u.existing_relationship);
        document.getElementById("nl-understood").textContent =
          `Understood: income ₹${u.income ? Math.round(u.income).toLocaleString("en-IN") : "?"} a year` +
          ` (from "${fmt(u.income_text)}"), age ${fmt(u.age)}, CIBIL ${fmt(u.cibil)}, ${fmt(u.employment)},` +
          ` existing bank relationship: ${u.existing_relationship === null ? "?" : (u.existing_relationship ? "yes" : "no")}` +
          (u.preferences ? `, wants: ${u.preferences}` : "");
        const q = document.getElementById("nl-questions");
        if (data.status === "need_more_info") {
          nlPrevious = u;
          q.innerHTML = data.questions.map((x) => `• ${x}`).join("<br>");
          document.getElementById("nl-message").value = "";
          return;
        }
        nlPrevious = null;
        q.textContent = "";
        renderResult({
          latency_ms: data.latency_ms,
          retrieved_k: "-",
          decisions: data.cards.map((c) => ({
            bank: c.bank, card: c.card, recommended: c.recommended, needs_review: c.needs_review,
            reason: c.sentence, cited_chunk_id: c.cited_chunk_id, what_to_change: c.what_to_change,
          })),
        });
        refreshTelemetry();
      } catch (err) {
        document.getElementById("error").textContent = "Ask failed: " + err.message;
      }
    });

    refreshTelemetry();
  </script>
</body>
</html>
