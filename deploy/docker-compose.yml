# Setup B: one container per node on a private Docker network.
#   python -m fl.distributed.prepare --out deploy/nodes
#   bash scripts/run_distributed_docker.sh            (or the commands at the end of DISTRIBUTED_FL.md)
# Each bank container mounts ONLY its own data folder (read-only); the server mounts only the test sets.
name: rq5-fl

x-node: &node
  image: rq5-fl:latest
  networks: [flnet]

services:
  superlink:
    <<: *node
    build: {context: .., dockerfile: deploy/Dockerfile}
    container_name: fl-superlink
    hostname: superlink
    command: >
      flower-superlink --insecure --host 0.0.0.0
      --disable-runtime-dependency-installation
    ports: ["8000:8000"]          # the researcher's `flwr run` talks to this port
    volumes:
      - hf-cache:/root/.cache/huggingface
      - ./nodes/server/eval:/app/deploy/nodes/server/eval:ro   # public test sets only
      - ./models:/app/deploy/models:ro                         # optional offline tiny model
      - ../results_fl:/app/results_fl                          # results written by the ServerApp

  bank-sbi:
    <<: *node
    container_name: fl-bank-sbi
    depends_on: [superlink]
    command: >
      flower-supernode --insecure --superlink superlink:8000
      --node-config "bank='SBI' data-dir='/data'"
    volumes:
      - hf-cache:/root/.cache/huggingface
      - ./nodes/SBI:/data:ro
      - ./models:/app/deploy/models:ro

  bank-hdfc:
    <<: *node
    container_name: fl-bank-hdfc
    depends_on: [superlink]
    command: >
      flower-supernode --insecure --superlink superlink:8000
      --node-config "bank='HDFC' data-dir='/data'"
    volumes:
      - hf-cache:/root/.cache/huggingface
      - ./nodes/HDFC:/data:ro
      - ./models:/app/deploy/models:ro

  bank-axis:
    <<: *node
    container_name: fl-bank-axis
    depends_on: [superlink]
    profiles: ["all-banks"]       # left out for the leave-one-bank-out run
    command: >
      flower-supernode --insecure --superlink superlink:8000
      --node-config "bank='AXIS' data-dir='/data'"
    volumes:
      - hf-cache:/root/.cache/huggingface
      - ./nodes/AXIS:/data:ro
      - ./models:/app/deploy/models:ro

networks:
  flnet:
    driver: bridge

volumes:
  hf-cache:   # cache of the PUBLIC base model only (Hugging Face download), never bank data
